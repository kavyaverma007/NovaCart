
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NovaCart | Demo Store</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>NovaCart</h1>
    <button id="cart-toggle" type="button">
  Cart (0)
</button>
  </header>

  <main>
    <h2>Discover your essentials</h2>
    <input id="search" placeholder="Search products...">
    <section id="products"></section>
    
<section id="cart" hidden>
  <h2>Your Shopping Cart</h2>
  <div id="cart-items"></div>
  <div id="cart-summary"></div>
  <button id="checkout-start" type="button">
    Proceed to Checkout
  </button>
</section>

<section id="checkout" hidden>
  <h2>Checkout</h2>
  <p>Review your order and enter delivery details.</p>

  <div id="checkout-summary"></div>

  <form id="checkout-form">
    <h3>Delivery Information</h3>

    <label for="customer-name">Full name</label>
    <input
      id="customer-name"
      name="customerName"
      type="text"
      autocomplete="name"
      maxlength="100"
      required
    />

    <label for="customer-email">Email address</label>
    <input
      id="customer-email"
      name="email"
      type="email"
      autocomplete="email"
      maxlength="254"
      required
    />

    <label for="customer-phone">Phone number</label>
    <input
  id="customer-phone"
  name="phone"
  type="tel"
  autocomplete="tel"
  inputmode="tel"
  pattern="[0-9()+ ]{10,20}"
  maxlength="20"
  title="Enter 10–20 characters using digits, spaces, +, ( or )."
  required
/>

    <label for="customer-address">House number and street</label>
    <textarea
      id="customer-address"
      name="address"
      autocomplete="street-address"
      maxlength="300"
      required
    ></textarea>

    <label for="customer-city">City</label>
    <input
      id="customer-city"
      name="city"
      type="text"
      autocomplete="address-level2"
      maxlength="100"
      required
    />

    <label for="customer-state">State</label>
    <input
      id="customer-state"
      name="state"
      type="text"
      autocomplete="address-level1"
      maxlength="100"
      required
    />

    <label for="customer-pin">PIN code</label>
    <input
      id="customer-pin"
      name="pin"
      type="text"
      autocomplete="postal-code"
      inputmode="numeric"
      pattern="[0-9]{6}"
      maxlength="6"
      title="Enter a 6-digit Indian PIN code."
      required
    />

    <p id="checkout-message" role="status" aria-live="polite"></p>

    <button type="submit">Review Demo Order</button>
    <button id="checkout-back" type="button">
      Back to Cart
    </button>
  </form>
</section>

  </main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>
<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/app.js"></script>
<script src="js/checkout.js"></script>


</body>
</html>
